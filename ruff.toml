# Phase 0 (plan_3.md): CI now blocks on ruff instead of --exit-zero, so the
# rule set has to be one this repo can actually pass. Ruff's un-pinned
# defaults (as of 0.16) additionally pull in bandit/pyupgrade/pylint/ruff
# "preview-ish" rule families -- 121 pre-existing findings on an unmodified
# checkout, none related to this plan's fixes. Pinning an explicit, narrow
# baseline (pyflakes correctness rules, pycodestyle errors, import sorting)
# keeps CI meaningful: it fails on real new mistakes in a PR's own diff,
# not on repo-wide debt no one signed up to fix. Broadening this select set
# (e.g. adding back bandit's blind-except/try-except-pass checks) is a
# reasonable follow-up, but as its own reviewed pass, not a side effect of
# turning CI on.
line-length = 120

[lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length handled by `line-length` above, not as a hard error
